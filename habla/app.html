<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habla — Comunicador</title>
<meta name="description" content="Comunicador gratuito para personas que no pueden hablar. Funciona sin internet.">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#fffaf0;--fg:#1b1f24;--card:#fff;--line:#d9d2c3;--accent:#1f6feb;--on-accent:#fff;--bar:#fff;--muted:#6b6458;--shadow:0 2px 0 rgba(0,0,0,.12);--fs:1}
:root[data-theme=dark]{--bg:#12161c;--fg:#f2f4f7;--card:#1d242e;--line:#35404f;--accent:#5aa2ff;--on-accent:#0b1118;--bar:#1d242e;--muted:#9aa6b5}
:root[data-theme=contrast]{--bg:#000;--fg:#ffe600;--card:#000;--line:#ffe600;--accent:#ffe600;--on-accent:#000;--bar:#000;--muted:#ffe600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
header{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bar);border-bottom:2px solid var(--line)}
#sentence{flex:1;min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border:2px solid var(--line);border-radius:14px;background:var(--card);overflow-y:auto;max-height:28vh;cursor:pointer}
#sentence:empty::before{content:attr(data-ph);color:var(--muted);font-size:calc(1.1rem*var(--fs))}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,var(--card));border:1px solid var(--accent);font-size:calc(1.25rem*var(--fs));font-weight:600}
.chip i{font-style:normal;font-size:calc(1.6rem*var(--fs))}
.chip img{width:calc(32px*var(--fs));height:calc(32px*var(--fs));object-fit:cover;border-radius:6px}
.ctl{width:64px;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.7rem;box-shadow:var(--shadow);flex:none}
.ctl.speak{background:var(--accent);color:var(--on-accent);border-color:var(--accent);width:84px}
.ctl:active{transform:translateY(2px);box-shadow:none}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--bar);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:calc(1rem*var(--fs));white-space:nowrap}
nav button[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
nav button.edit{border-style:dashed}
nav button.edit.on{background:#e8a33d;border-color:#e8a33d;color:#000}
main{flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
#ptitle{display:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(110px*var(--fs)),1fr));gap:10px}
#grid.wide{grid-template-columns:repeat(auto-fill,minmax(calc(200px*var(--fs)),1fr))}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:calc(112px*var(--fs));padding:8px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:calc(1.05rem*var(--fs));text-align:center;line-height:1.15;position:relative;word-break:break-word}
.tile .e{font-size:calc(2.8rem*var(--fs));line-height:1}
.tile img{width:calc(64px*var(--fs));height:calc(64px*var(--fs));object-fit:cover;border-radius:10px}
.tile:active{transform:translateY(2px);box-shadow:none;border-color:var(--accent)}
.tile.add{border-style:dashed;color:var(--muted)}
.tile .x{position:absolute;top:2px;right:2px;width:34px;height:34px;border-radius:50%;font-size:1rem;background:#d9534f;color:#fff;border:0;display:flex;align-items:center;justify-content:center}
.k-pron{border-color:#e8a33d}.k-verb{border-color:#3fa564}.k-adj{border-color:#8a63d2}.k-noun{border-color:#e8793d}.k-misc{border-color:#4a90d9}.k-neg{border-color:#d9534f}
#kb{display:none;flex-direction:column;gap:10px}
#kb.on{display:flex}
#txt{width:100%;min-height:96px;font-size:calc(1.6rem*var(--fs));padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);user-select:text;-webkit-user-select:text;resize:vertical;font-family:inherit}
#pred{display:flex;gap:8px;flex-wrap:wrap}
#pred button{padding:10px 16px;border-radius:12px;border:2px solid var(--accent);background:var(--card);font-size:calc(1.3rem*var(--fs));font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.big{padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:calc(1.05rem*var(--fs))}
.big.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.big.full{width:100%}
.big:disabled{opacity:.5}
dialog{border:3px solid var(--line);border-radius:18px;background:var(--bg);color:var(--fg);max-width:min(560px,94vw);width:100%;padding:18px;max-height:90vh;overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:1.35rem}
dialog h3{margin:18px 0 8px;font-size:1.05rem}
label{display:block;margin:12px 0 4px;font-weight:700}
label.chk{display:flex;gap:10px;align-items:center}
label.chk input{width:22px;height:22px}
select,input[type=text],input[type=range]{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);user-select:text;-webkit-user-select:text}
input[type=range]{padding:0}
.hint{font-size:.88rem;color:var(--muted);margin:10px 0 0;line-height:1.45}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:999px;background:#e8a33d;color:#000;vertical-align:middle;margin-left:4px}
.list{display:flex;flex-direction:column;gap:8px}
.list .item{display:flex;align-items:center;gap:8px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.list .item.cur{border-color:var(--accent)}
.list .item span{flex:1;font-weight:700}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.plan{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.plan.hl{border-color:var(--accent)}
.plan h4{margin:0;font-size:1.1rem}
.plan .price{font-size:1.5rem;font-weight:800}
.plan .price small{font-size:.85rem;font-weight:600;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;font-size:.9rem;line-height:1.45;flex:1}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.ok{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#3fa564 18%,var(--card));border:2px solid #3fa564;font-weight:700}
.code{width:100%;font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;padding:8px;border:2px dashed var(--line);border-radius:10px;background:var(--card);user-select:all;-webkit-user-select:all}
#preview{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border:2px dashed var(--line);border-radius:14px;font-size:3rem;overflow:hidden;background:var(--card)}
#preview img{width:100%;height:100%;object-fit:cover}
.stats li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.stats{list-style:none;padding:0;margin:0}
footer.legal{font-size:.8rem;margin-top:16px;color:var(--muted)}
footer.legal a{margin-right:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
#toast.on{opacity:1}
@media (max-width:600px){header{flex-wrap:wrap}#sentence{flex:1 1 100%;min-height:56px;max-height:22vh}.ctl{flex:1;width:auto;height:52px;font-size:1.4rem}.ctl.speak{flex:2;width:auto}.plans{grid-template-columns:1fr}}
@media print{
  header,nav,#kb,#toast,dialog{display:none!important}
  body{display:block;background:#fff;color:#000}
  main{overflow:visible;padding:0}
  #ptitle{display:block;font-size:20pt;margin:0 0 10pt}
  #grid{grid-template-columns:repeat(4,1fr)!important;gap:8pt}
  .tile{box-shadow:none;min-height:110pt;break-inside:avoid;background:#fff;color:#000}
  .tile .x,.tile.add{display:none!important}
}
</style>
</head>
<body>
<header>
  <div id="sentence" role="button" tabindex="0" aria-label="Frase actual. Toca para hablar"></div>
  <button class="ctl" id="back" aria-label="Borrar última palabra">⌫</button>
  <button class="ctl" id="clear" aria-label="Borrar todo">🗑️</button>
  <button class="ctl speak" id="speak" aria-label="Hablar">🔊</button>
  <button class="ctl" id="cfg" aria-label="Ajustes">⚙️</button>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
  <h1 id="ptitle"></h1>
  <div id="grid"></div>
  <div id="kb">
    <textarea id="txt" aria-label="Texto"></textarea>
    <div id="pred"></div>
    <div class="row">
      <button class="big pri" id="kbSpeak"></button>
      <button class="big" id="kbSave"></button>
      <button class="big" id="kbClear"></button>
    </div>
    <div id="hist"></div>
  </div>
</main>

<!-- Ajustes -->
<dialog id="dlgCfg">
  <h2 data-t="settings"></h2>
  <div class="list"><div class="item cur"><span id="cfgProfile"></span><button class="big" id="openProfiles" data-t="profiles"></button></div></div>
  <label for="lang" data-t="lang"></label>
  <select id="lang"><option value="es">Español</option><option value="en">English</option></select>
  <label for="voice" data-t="voice"></label>
  <select id="voice"></select>
  <label for="rate" data-t="rate"></label>
  <input type="range" id="rate" min="0.5" max="1.5" step="0.1">
  <label for="size" data-t="size"></label>
  <input type="range" id="size" min="0.8" max="1.6" step="0.1">
  <label for="theme" data-t="theme"></label>
  <select id="theme"><option value="light" data-t="light"></option><option value="dark" data-t="dark"></option><option value="contrast" data-t="contrast"></option></select>
  <label class="chk"><input type="checkbox" id="auto"> <span data-t="auto"></span></label>
  <label class="chk"><input type="checkbox" id="lock"> <span data-t="lock"></span></label>
  <p class="hint" data-t="lockHint"></p>

  <h3 data-t="membership"></h3>
  <button class="big full" id="openPlans"></button>

  <h3 data-t="tools"></h3>
  <div class="row">
    <button class="big" id="printBoard"></button>
    <button class="big" id="openStats"></button>
    <button class="big" id="shareProfile"></button>
  </div>

  <h3 data-t="backup"></h3>
  <div class="row">
    <button class="big" id="export" data-t="exportAll"></button>
    <button class="big" id="import" data-t="importFile"></button>
  </div>
  <p class="hint" data-t="privacyHint"></p>

  <div class="row" style="margin-top:14px"><button class="big pri full" data-close data-t="done"></button></div>
  <footer class="legal"><a href="./">Habla</a><a href="privacidad.html" data-t="privacy"></a><a href="terminos.html" data-t="terms"></a><a href="reembolsos.html" data-t="refunds"></a></footer>
</dialog>

<!-- Perfiles -->
<dialog id="dlgProfiles">
  <h2 data-t="profiles"></h2>
  <div class="list" id="profList"></div>
  <label for="newProfName" data-t="newProfile"></label>
  <div class="row"><input type="text" id="newProfName" maxlength="40" style="flex:1"><button class="big pri" id="addProfile" data-t="add"></button></div>
  <p class="hint" id="profHint"></p>
  <div class="row" style="margin-top:14px"><button class="big full" data-close data-t="done"></button></div>
</dialog>

<!-- Nuevo botón -->
<dialog id="dlgItem">
  <h2 data-t="newButton"></h2>
  <div class="row" style="align-items:center">
    <div id="preview">⭐</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <button class="big" id="pickPhoto"></button>
      <button class="big" id="clearPhoto" data-t="noPhoto"></button>
    </div>
  </div>
  <label for="itemText" data-t="itemText"></label>
  <input type="text" id="itemText" maxlength="80">
  <label for="itemEmoji" data-t="itemEmoji"></label>
  <input type="text" id="itemEmoji" maxlength="8" value="⭐">
  <div class="row" style="margin-top:14px"><button class="big" data-close data-t="cancel"></button><button class="big pri" id="saveItem" data-t="save" style="flex:1"></button></div>
</dialog>

<!-- Nuevo tablero -->
<dialog id="dlgBoard">
  <h2 data-t="newBoard"></h2>
  <label for="boardName" data-t="boardName"></label>
  <input type="text" id="boardName" maxlength="30">
  <label for="boardEmoji" data-t="itemEmoji"></label>
  <input type="text" id="boardEmoji" maxlength="8" value="📁">
  <div class="row" style="margin-top:14px"><button class="big" data-close data-t="cancel"></button><button class="big pri" id="saveBoard" data-t="save" style="flex:1"></button></div>
</dialog>

<!-- Membresía -->
<dialog id="dlgPlans">
  <h2 id="plTitle"></h2>
  <div id="plBody"></div>
  <div class="row" style="margin-top:14px"><button class="big full" data-close data-t="close"></button></div>
  <footer class="legal"><a href="terminos.html" data-t="terms"></a><a href="reembolsos.html" data-t="refunds"></a><a href="privacidad.html" data-t="privacy"></a></footer>
</dialog>

<!-- Estadísticas -->
<dialog id="dlgStats">
  <h2 data-t="stats"></h2>
  <p class="hint" data-t="statsHint"></p>
  <ul class="stats" id="statList"></ul>
  <div class="row" style="margin-top:14px"><button class="big" id="resetStats" data-t="reset"></button><button class="big pri" data-close data-t="close" style="flex:1"></button></div>
</dialog>

<input type="file" id="photoInput" accept="image/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vocab.js"></script>
<script src="app.js"></script>
</body>
</html>
